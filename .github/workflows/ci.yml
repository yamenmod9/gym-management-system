name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # matches backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        # `tests/`, not the whole directory: backend/test_register.py is a
        # manual script that talks to a running server, and collecting it
        # fails the run before a single real test executes.
        #
        # Each test module points DATABASE_URL at its own throwaway SQLite
        # file, so no service container is needed.
        run: python -m pytest tests/ -q

  audit:
    name: Backend dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Audit installed packages
        # Audits the environment rather than `-r requirements.txt`, which makes
        # pip-audit resolve and build every pin from source — slow, and it fails
        # outright on psycopg2-binary without libpq headers. The installed set
        # is also the more honest target: it includes transitive packages, which
        # is where most advisories actually are.
        #
        # Blocking, because it currently passes. The set this replaced carried
        # advisories in five packages on the request path — nine in PyJWT alone,
        # which verifies every access token here — and the pins in
        # requirements.txt were raised until this step reported clean. A gate
        # that is green today is worth failing on tomorrow; Dependabot opens the
        # PR that fixes it.
        run: pip-audit --progress-spinner off --desc

  flutter:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        # --no-fatal-infos is deliberate. `flutter analyze` exits non-zero on
        # *any* finding, and this repository carries ~200 pre-existing
        # info-level lints (deprecated withOpacity and friends). With the
        # default the job failed on every single push, which is why CI had been
        # red continuously and the tests below had never once run. Errors and
        # warnings still fail the build; infos are visible in the log without
        # blocking. Clearing the infos is worth doing separately — this makes
        # the gate mean something today.
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test
